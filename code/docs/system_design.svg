<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#5f5e5a"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#7f77dd"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="38" font-size="20" font-weight="600" fill="#2c2c2a">Ghost Data Still Exists — deletion audit agent</text>
  <text x="40" y="60" font-size="13" fill="#5f5e5a">Evidence over claims. Code decides; the model reads what code can't parse and arbitrates only where the evidence disagrees.</text>

  <!-- Sources column -->
  <g font-size="12" fill="#2c2c2a">
    <rect x="40" y="100" width="150" height="46" rx="6" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1"/>
    <text x="115" y="119" text-anchor="middle" font-weight="600">evidence/ 94 files</text>
    <text x="115" y="136" text-anchor="middle" fill="#5f5e5a">json txt sql log png pdf</text>

    <rect x="40" y="160" width="150" height="46" rx="6" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1"/>
    <text x="115" y="179" text-anchor="middle" font-weight="600">identities + audit log</text>
    <text x="115" y="196" text-anchor="middle" fill="#5f5e5a">850 users · 306 changes</text>

    <rect x="40" y="220" width="150" height="46" rx="6" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1"/>
    <text x="115" y="239" text-anchor="middle" font-weight="600">system_activity</text>
    <text x="115" y="256" text-anchor="middle" fill="#5f5e5a">4,011 claimed events</text>

    <rect x="40" y="280" width="150" height="46" rx="6" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1"/>
    <text x="115" y="299" text-anchor="middle" font-weight="600">deletion_requests</text>
    <text x="115" y="316" text-anchor="middle" fill="#5f5e5a">518 cases · 375 unique texts</text>

    <rect x="40" y="340" width="150" height="46" rx="6" fill="#f1efe8" stroke="#b4b2a9" stroke-width="1"/>
    <text x="115" y="359" text-anchor="middle" font-weight="600">deletion_rules</text>
    <text x="115" y="376" text-anchor="middle" fill="#5f5e5a">15 category policies</text>
  </g>

  <!-- L0 Ingestion band -->
  <rect x="230" y="90" width="930" height="150" rx="10" fill="#fbfbf9" stroke="#d3d1c7" stroke-width="1"/>
  <text x="246" y="112" font-size="12" font-weight="600" fill="#5f5e5a" letter-spacing="1">L0 · INGESTION · ONCE PER RUN</text>

  <g font-size="12">
    <rect x="246" y="124" width="150" height="100" rx="6" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
    <text x="321" y="145" text-anchor="middle" font-weight="600" fill="#085041">Text parsers</text>
    <text x="321" y="164" text-anchor="middle" fill="#0f6e56">records · sql · logs</text>
    <text x="321" y="180" text-anchor="middle" fill="#0f6e56">pdf via text layer</text>
    <text x="321" y="200" text-anchor="middle" fill="#0f6e56">83 files, 0 model calls</text>

    <rect x="412" y="124" width="150" height="100" rx="6" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
    <text x="487" y="145" text-anchor="middle" font-weight="600" fill="#3c3489">Vision reader</text>
    <text x="487" y="164" text-anchor="middle" fill="#534ab7">11 png · 2 reads each</text>
    <text x="487" y="178" text-anchor="middle" fill="#534ab7">agreement admits a row</text>
    <text x="487" y="193" text-anchor="middle" fill="#534ab7">else Opus tiebreak (0 used)</text>
    <text x="487" y="210" text-anchor="middle" fill="#534ab7">Sonnet · 22 calls</text>

    <rect x="578" y="124" width="150" height="100" rx="6" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
    <text x="653" y="145" text-anchor="middle" font-weight="600" fill="#3c3489">Intent classifier</text>
    <text x="653" y="164" text-anchor="middle" fill="#534ab7">375 texts · 25 per call</text>
    <text x="653" y="180" text-anchor="middle" fill="#534ab7">enum + second label</text>
    <text x="653" y="200" text-anchor="middle" fill="#534ab7">Sonnet · 15 calls</text>

    <rect x="744" y="124" width="150" height="100" rx="6" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
    <text x="819" y="145" text-anchor="middle" font-weight="600" fill="#085041">Identity graph</text>
    <text x="819" y="164" text-anchor="middle" fill="#0f6e56">current + historical</text>
    <text x="819" y="180" text-anchor="middle" fill="#0f6e56">email, hash, phone, id</text>
    <text x="819" y="200" text-anchor="middle" fill="#0f6e56">418 / 100 resolved</text>

    <rect x="910" y="124" width="234" height="100" rx="6" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
    <text x="1027" y="145" text-anchor="middle" font-weight="600" fill="#085041">Observation table</text>
    <text x="1027" y="164" text-anchor="middle" fill="#0f6e56">file · time · system · resource</text>
    <text x="1027" y="180" text-anchor="middle" fill="#0f6e56">category · state · identifiers</text>
    <text x="1027" y="200" text-anchor="middle" fill="#0f6e56">indexed by identifier + resource</text>
  </g>

  <!-- source arrows into L0 -->
  <line x1="190" y1="123" x2="244" y2="150" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M190 183 L212 183 L212 234 L819 234 L819 227" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <line x1="190" y1="303" x2="576" y2="210" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <!-- parsers -> table -->
  <line x1="396" y1="174" x2="410" y2="174" stroke="#5f5e5a" stroke-width="1.2"/>
  <line x1="562" y1="174" x2="576" y2="174" stroke="#5f5e5a" stroke-width="1.2"/>
  <path d="M894 212 L902 212 L902 174 L908 174" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- L1 Engine band -->
  <rect x="230" y="270" width="560" height="280" rx="10" fill="#fbfbf9" stroke="#d3d1c7" stroke-width="1"/>
  <text x="246" y="292" font-size="12" font-weight="600" fill="#5f5e5a" letter-spacing="1">L1 · AUDIT ENGINE · PER CASE · PURE FUNCTIONS</text>

  <g font-size="12" fill="#085041">
    <rect x="246" y="306" width="528" height="36" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="262" y="328" font-weight="600">Intent gate</text><text x="400" y="328" fill="#0f6e56">non-deletion → NOT_APPLICABLE, []</text>

    <rect x="246" y="352" width="528" height="36" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="262" y="374" font-weight="600">Resolve + link</text><text x="400" y="374" fill="#0f6e56">ladder L1–L5 (L6 off) · scope rule · 94/94 links correct</text>

    <rect x="246" y="398" width="528" height="36" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="262" y="420" font-weight="600">state_at(audit_at)</text><text x="400" y="420" fill="#0f6e56">latest file per resource, safer state within it · inclusive cutoff</text>

    <rect x="246" y="444" width="528" height="36" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="262" y="466" font-weight="600">policy_diff</text><text x="400" y="466" fill="#0f6e56">required treatment vs observed → violations + compliant</text>

    <rect x="246" y="490" width="528" height="36" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="262" y="512" font-weight="600">build_steps</text><text x="400" y="512" fill="#0f6e56">findings → remediation → verification · sorted by spec key</text>
  </g>

  <!-- table -> engine -->
  <path d="M1027 224 L1027 250 L510 250 L510 268" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <!-- rules -> policy -->
  <path d="M190 363 L210 363 L210 462 L244 462" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <!-- activity -> link -->
  <path d="M190 243 L218 243 L218 370 L244 370" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>

  <!-- L2 Agent band -->
  <rect x="820" y="270" width="340" height="280" rx="10" fill="#fbfbf9" stroke="#d3d1c7" stroke-width="1"/>
  <text x="836" y="292" font-size="12" font-weight="600" fill="#5f5e5a" letter-spacing="1">L2 · INVESTIGATOR AGENT · FLAGGED ONLY</text>

  <g font-size="12">
    <rect x="836" y="306" width="308" height="64" rx="6" fill="#eeedfe" stroke="#7f77dd"/>
    <text x="990" y="326" text-anchor="middle" font-weight="600" fill="#3c3489">Gate (code): three conditions</text>
    <text x="990" y="343" text-anchor="middle" fill="#534ab7">zero citable observations · conflicting snapshots</text>
    <text x="990" y="359" text-anchor="middle" fill="#534ab7">violation supported only by a screenshot</text>

    <rect x="836" y="380" width="308" height="116" rx="6" fill="#eeedfe" stroke="#7f77dd"/>
    <text x="990" y="400" text-anchor="middle" font-weight="600" fill="#3c3489">Tool loop · Opus · ≤ 6 turns</text>
    <text x="990" y="419" text-anchor="middle" fill="#534ab7">list_observations · read_evidence_file</text>
    <text x="990" y="435" text-anchor="middle" fill="#534ab7">search_raw_evidence · apply_policy</text>
    <text x="990" y="451" text-anchor="middle" fill="#534ab7">submit_decision</text>
    <text x="990" y="471" text-anchor="middle" font-weight="600" fill="#3c3489">picks an engine candidate, stricter only</text>
    <text x="990" y="487" text-anchor="middle" font-weight="600" fill="#3c3489">never writes a step</text>

    <rect x="836" y="502" width="308" height="44" rx="6" fill="#ffffff" stroke="#7f77dd" stroke-dasharray="3 3"/>
    <text x="990" y="520" text-anchor="middle" fill="#534ab7">on failure or max turns → engine default</text>
    <text x="990" y="536" text-anchor="middle" fill="#534ab7">every case gets traces/&lt;case&gt;.json</text>
  </g>

  <!-- engine <-> agent -->
  <line x1="774" y1="436" x2="834" y2="436" stroke="#7f77dd" stroke-width="1.4" marker-end="url(#ap)"/>
  <text x="804" y="426" text-anchor="middle" font-size="11" fill="#534ab7">flagged</text>
  <path d="M836 524 L800 524 L800 508 L776 508" fill="none" stroke="#7f77dd" stroke-width="1.4" marker-end="url(#ap)"/>
  <text x="806" y="540" text-anchor="middle" font-size="11" fill="#534ab7">candidate</text>

  <!-- L3 Guardrails band -->
  <rect x="230" y="580" width="930" height="180" rx="10" fill="#fbfbf9" stroke="#d3d1c7" stroke-width="1"/>
  <text x="246" y="602" font-size="12" font-weight="600" fill="#5f5e5a" letter-spacing="1">L3 · GUARDRAILS · EVERY ROW · guards.py</text>

  <g font-size="12" fill="#085041">
    <rect x="246" y="616" width="210" height="56" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="351" y="637" text-anchor="middle" font-weight="600">Contract</text>
    <text x="351" y="655" text-anchor="middle" fill="#0f6e56">15 triples · order · evidence rules</text>

    <rect x="472" y="616" width="210" height="56" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="577" y="637" text-anchor="middle" font-weight="600">Policy contract</text>
    <text x="577" y="655" text-anchor="middle" fill="#0f6e56">no DELETE on retained · no cache_*</text>

    <rect x="698" y="616" width="210" height="56" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="803" y="637" text-anchor="middle" font-weight="600">Time + citation</text>
    <text x="803" y="655" text-anchor="middle" fill="#0f6e56">id exists · ≤ audit_at · file observes it</text>

    <rect x="924" y="616" width="220" height="56" rx="6" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="1034" y="637" text-anchor="middle" font-weight="600">COMPLETE re-derive</text>
    <text x="1034" y="655" text-anchor="middle" fill="#0f6e56">from cited evidence · downgrade only</text>

    <rect x="246" y="686" width="290" height="56" rx="6" fill="#faece7" stroke="#d85a30"/>
    <text x="391" y="707" text-anchor="middle" font-weight="600" fill="#712b13">Regenerate → repair</text>
    <text x="391" y="725" text-anchor="middle" fill="#993c1d">engine w/o agent → repair · CONTRACT_REPAIRED</text>

    <rect x="552" y="686" width="290" height="56" rx="6" fill="#faece7" stroke="#d85a30"/>
    <text x="697" y="707" text-anchor="middle" font-weight="600" fill="#712b13">Cross-row check</text>
    <text x="697" y="725" text-anchor="middle" fill="#993c1d">518 rows · status-mix drift vs samples</text>

    <rect x="858" y="686" width="286" height="56" rx="6" fill="#faece7" stroke="#d85a30" stroke-dasharray="4 3"/>
    <text x="1001" y="707" text-anchor="middle" font-weight="600" fill="#712b13">Exception wrapper · wraps all</text>
    <text x="1001" y="725" text-anchor="middle" fill="#993c1d">per case · row never missing · NEEDS_REVIEW</text>
  </g>

  <!-- engine -> guards -->
  <line x1="510" y1="526" x2="510" y2="578" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="456" y1="644" x2="470" y2="644" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="682" y1="644" x2="696" y2="644" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="908" y1="644" x2="922" y2="644" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M1034 672 L1034 679 L391 679 L391 684" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="1040" y="682" font-size="10" fill="#5f5e5a">any failure</text>
  <line x1="536" y1="714" x2="550" y2="714" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Outputs -->
  <line x1="695" y1="760" x2="695" y2="788" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g font-size="12" fill="#2c2c2a">
    <rect x="230" y="790" width="930" height="56" rx="8" fill="#f1efe8" stroke="#b4b2a9"/>
    <text x="695" y="812" text-anchor="middle" font-weight="600">output.csv · 518 rows</text>
    <text x="695" y="831" text-anchor="middle" fill="#5f5e5a">runs/&lt;mode&gt;/&lt;id&gt;/traces/&lt;case&gt;.json · llm_calls.jsonl · manifest · evaluation_report.md · usage_report.md</text>
  </g>

  <!-- Observability strip -->
  <text x="40" y="600" font-size="11" font-weight="600" fill="#5f5e5a" letter-spacing="1">CROSS-CUTTING</text>
  <g font-size="11" fill="#5f5e5a">
    <text x="40" y="620">structlog, case_id on case events</text>
    <text x="40" y="638">llm.py owns client + call log</text>
    <text x="40" y="656">cache by content hash</text>
    <text x="40" y="674">budget.py breaker</text>
    <text x="40" y="692">replay mode: cache only, no key</text>
    <text x="40" y="710">Flag enum recorded per trace</text>
  </g>

  <!-- Legend -->
  <g font-size="11">
    <rect x="40" y="840" width="12" height="12" rx="2" fill="#e1f5ee" stroke="#1d9e75"/>
    <text x="58" y="850" fill="#5f5e5a">deterministic Python</text>
    <rect x="40" y="860" width="12" height="12" rx="2" fill="#eeedfe" stroke="#7f77dd"/>
    <text x="58" y="870" fill="#5f5e5a">LLM, cached, schema-constrained</text>
    <rect x="40" y="880" width="12" height="12" rx="2" fill="#faece7" stroke="#d85a30"/>
    <text x="58" y="890" fill="#5f5e5a">safety net</text>
  </g>
</svg>
