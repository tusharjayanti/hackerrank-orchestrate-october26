[project]
name = "ghostaudit"
version = "0.1.0"
description = "Deletion-audit agent for HackerRank Orchestrate: Ghost Data Still Exists"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "anthropic>=0.40",
    "structlog>=24.1",
    "pypdf>=6.21.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The owner's hand-labelled gold set, kept verbatim on one line per row.
"code/evaluation/intent_gold.py" = ["E501"]
# Prompt text is exact: reflowing it changes the prompt and every cached answer.
"code/ghostaudit/intent_prompts.py" = ["E501"]
# Log-line fixtures reproduce real evidence syntax verbatim.
"code/tests/test_ingest.py" = ["E501"]
